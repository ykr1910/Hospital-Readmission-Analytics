
name: Hospital Readmission CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Check Python syntax
        run: |
          python -m compileall -q api dashboard scripts inspect_ml_data.py test_ml_database.py

      - name: Build Docker image
        run: docker build -f Dockerfile.ci -t hospital-readmission-api:ci .

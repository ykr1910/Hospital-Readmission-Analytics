
name: Hospital Readmission CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install test dependencies
        run: python -m pip install -r requirements-test.txt

      - name: Create CI-only model artifacts
        run: |
          python -c "import json, joblib, pandas as pd; from sklearn.dummy import DummyClassifier; from pathlib import Path; p=Path('models'); p.mkdir(exist_ok=True); columns=['age_group','gender','admission_type_id','time_in_hospital','prior_visits','diagnosis_count','medication_count','medical_specialty']; X=pd.DataFrame([['70-80','Female',1,3,0,5,10,'InternalMedicine'],['50-60','Male',2,2,1,3,5,'Cardiology']],columns=columns); model=DummyClassifier(strategy='prior').fit(X,[0,1]); joblib.dump(model,p/'best_model.joblib'); (p/'decision_threshold.json').write_text(json.dumps({'model_name':'CI-placeholder','threshold':0.1336142122745514})); (p/'deployment_manifest.json').write_text(json.dumps({'model_name':'CI-placeholder','model_version':'ci','deployment_stage':'ci','metrics':{},'model_registry':{}}))"

      - name: Check Python syntax
        run: |
          python -m compileall -q api dashboard scripts inspect_ml_data.py test_ml_database.py tests

      - name: Run automated API tests
        run: python -m pytest tests/test_api.py -v

      - name: Build Docker image
        run: docker build -f Dockerfile.ci -t hospital-readmission-api:ci .

      - name: Start CI API container
        run: |
          docker run -d --name hospital-readmission-api-ci -p 8000:8000 hospital-readmission-api:ci

      - name: Test API health endpoint
        run: |
          python -c "import time, requests; url='http://127.0.0.1:8000/health'; exec('for attempt in range(30):\n try:\n  response=requests.get(url, timeout=2)\n  response.raise_for_status()\n  print(response.json())\n  break\n except Exception:\n  if attempt == 29: raise\n  time.sleep(2)')"

      - name: Test API prediction endpoint
        run: |
          python -c "import requests; payload={'age_group':'70-80','gender':'Female','admission_type_id':1,'time_in_hospital':3,'prior_visits':0,'diagnosis_count':5,'medication_count':10,'medical_specialty':'InternalMedicine'}; response=requests.post('http://127.0.0.1:8000/predict', json=payload, headers={'X-Traffic-Type':'test'}, timeout=10); response.raise_for_status(); result=response.json(); assert 0 <= result['probability'] <= 1; assert result['predicted_readmission_within_30_days'] in [0,1]; print(result)"

      - name: Show API logs on failure
        if: failure()
        run: docker logs hospital-readmission-api-ci

      - name: Stop CI API container
        if: always()
        run: docker rm -f hospital-readmission-api-ci
